apiVersion: agentguard.jozu.dev/v1
kind: AgentDefinition
metadata:
  name: gray-falcon-imint-agent-untrusted
spec:
  # No spec.framework — the coding agent is chosen at launch time
  # (`agentguard run <agent>`), so this one definition runs under
  # claude-code, codex, or gemini. See scene-2a/agent-config.sh.
  modules:
    - name: tool-restrictions
      type: policy
      source:
        modelkit: registry.kind.cluster/gray-falcon/tool-control-policy:v1

    - name: untrusted-mcp
      type: mcp
      source:
        modelkit: ghcr.io/random-org/untrusted-tool:latest
