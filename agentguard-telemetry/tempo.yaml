server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  # Flush quickly so a span shows up in the UI while you are still demoing it,
  # rather than after the default multi-minute idle period.
  max_block_duration: 5m
  complete_block_timeout: 10s

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal
